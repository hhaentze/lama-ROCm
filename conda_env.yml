# Conda environment for LaMa on AMD GPUs (ROCm).
#
# This environment targets AMD RDNA / RDNA4 cards (e.g. Radeon RX 9070 XT) on
# Linux via the ROCm build of PyTorch. It replaces the original CUDA 10.2 /
# Python 3.6 / PyTorch 1.8 environment, which does not support recent AMD GPUs.
#
# Version rationale (lowest versions that reliably support modern AMD GPUs while
# keeping the LaMa code working):
#   * python 3.10            - supported by every dependency below
#   * torch 2.8.0 + rocm6.4  - first stack that works well on RDNA4 (gfx1201)
#   * torchvision 0.23.0     - matching release for torch 2.8.0
#   * pytorch-lightning 2.5  - compatible with torch 2.x (major API rewrite vs 1.x)
#
# Create with:
#   conda env create -f conda_env.yml
#   conda activate lama
#
# NOTE: torch/torchvision are pulled from the official ROCm wheel index below.
# If you use a different ROCm version, change both the `--extra-index-url` and
# the `+rocm6.4` local version tags to match (see https://pytorch.org).
name: lama
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip>=23
  - pip:
      # ---- PyTorch (ROCm build) --------------------------------------------
      - --extra-index-url https://download.pytorch.org/whl/rocm6.4
      - torch==2.8.0+rocm6.4
      - torchvision==0.23.0+rocm6.4
      # ---- Training / lightning --------------------------------------------
      - pytorch-lightning==2.5.6
      - torchmetrics>=1.0,<2.0
      - tensorboard>=2.14
      # ---- Config / infra --------------------------------------------------
      - hydra-core==1.3.2
      - omegaconf>=2.3,<2.4
      - easydict==1.13
      - tabulate>=0.9
      - packaging>=21
      - pyyaml>=6.0
      - tqdm>=4.65
      - joblib>=1.3
      # ---- Numerics / imaging ----------------------------------------------
      - numpy==1.26.4
      - scipy>=1.10,<1.14
      - pandas==2.0.3
      - scikit-image==0.21.0
      - scikit-learn==1.3.2
      - matplotlib>=3.7
      - opencv-python-headless==4.9.0.80
      - Pillow>=9.5
      - albumentations==1.3.1
      - kornia>=0.7.3,<0.9
      - shapely>=2.0
      # ---- Data / misc -----------------------------------------------------
      - webdataset>=0.2.86,<0.3
      - braceexpand==0.1.7
      - wldhx.yadisk-direct==0.0.6
